<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLM Evangelism</title>
<meta name="theme-color" content="#0b1626">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1626;--deep:#13243b;--gold:#e0b45a;--gold2:#f3d58f;--parch:#f3ead7;--sage:#6fae8a;--mute:#9fb0c6;--card:rgba(19,36,59,.82);--line:rgba(224,180,90,.22)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--parch);background:var(--night);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 55% at 50% -8%,rgba(243,213,143,.55),rgba(224,180,90,.14) 40%,transparent 70%),linear-gradient(#0b1626,#13243b 55%,#0b1626)}
.rays{position:fixed;inset:-20% -20% 40%;z-index:-2;opacity:.16;background:repeating-conic-gradient(from 0deg at 50% 0,#f3d58f 0 4deg,transparent 4deg 14deg);-webkit-mask:linear-gradient(#000,transparent 75%);mask:linear-gradient(#000,transparent 75%)}
#verse{position:fixed;inset:0;z-index:-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 2.2rem;font:italic 600 clamp(1.6rem,6vw,2.6rem)/1.3 "Cormorant Garamond",Georgia,serif;color:var(--gold2);opacity:.13;transition:opacity 1.6s;pointer-events:none}
#verse small{font:600 .9rem Manrope,sans-serif;margin-top:.8rem;letter-spacing:.04em}
#verse.off{opacity:0}
main{max-width:640px;margin:0 auto;padding:1.2rem 1rem 6rem}
h1{font:700 2rem/1.1 "Cormorant Garamond",Georgia,serif;color:var(--gold2)}
.sub{color:var(--mute);font-size:.9rem;margin-top:.2rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem;margin-top:1rem;backdrop-filter:blur(8px);display:flex;gap:1rem;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.9rem "Cormorant Garamond",serif;color:var(--gold2)}
.panel p{font-size:.95rem;line-height:1.45}
.link{background:none;border:0;color:var(--gold);font:600 .85rem Manrope;text-decoration:underline;cursor:pointer;padding:.3rem 0}
.tabs{display:flex;gap:.4rem;margin:1.2rem 0 .6rem;background:rgba(11,22,38,.7);border:1px solid var(--line);border-radius:14px;padding:.3rem}
.tabs button{flex:1;padding:.6rem;border:0;border-radius:10px;background:none;color:var(--mute);font:600 .9rem Manrope;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--night)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-top:.7rem;backdrop-filter:blur(8px)}
.card.won{border-color:rgba(111,174,138,.6)}
.top{display:flex;justify-content:space-between;gap:.6rem}
.card h3{font:700 1.35rem "Cormorant Garamond",serif;color:var(--parch)}
.meta,.when{color:var(--mute);font-size:.82rem;margin-top:.15rem}
.chip{align-self:flex-start;font-size:.75rem;font-weight:700;color:var(--gold2);border:1px solid var(--line);border-radius:99px;padding:.25rem .65rem;white-space:nowrap}
.note{font-size:.88rem;margin-top:.6rem;line-height:1.45;color:#d9d2c0;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}
.btn,.acts button{flex:1 1 auto;min-width:84px;text-align:center;text-decoration:none;padding:.68rem .8rem;border-radius:12px;border:1px solid var(--line);background:rgba(243,234,215,.06);color:var(--parch);font:700 .86rem Manrope;cursor:pointer;min-height:44px}
.btn.call{background:var(--deep);border-color:var(--gold)}
.btn.wa{background:#1f6b4a;border-color:#2f8f66}
.acts button.win{background:var(--gold);color:var(--night);border-color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:2.5rem 1rem;line-height:1.6}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));padding:.95rem 1.4rem;border-radius:99px;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--night);font:700 1rem Manrope;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}
dialog{border:1px solid var(--line);border-radius:20px;background:#10203a;color:var(--parch);width:min(92vw,520px);padding:1.2rem;max-height:90vh}
dialog::backdrop{background:rgba(5,10,20,.75)}
dialog h2{font:700 1.6rem "Cormorant Garamond",serif;color:var(--gold2);margin-bottom:.6rem}
label{display:block;font-size:.8rem;color:var(--mute);margin:.7rem 0 .25rem}
input,select,textarea{width:100%;padding:.7rem;border-radius:10px;border:1px solid var(--line);background:#0b1626;color:var(--parch);font:500 1rem Manrope}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:.5rem;margin-top:1rem}
.row button{flex:1;padding:.8rem;border-radius:12px;border:1px solid var(--line);background:none;color:var(--parch);font:700 .95rem Manrope;cursor:pointer}
.row .go{background:var(--gold);color:var(--night);border-color:var(--gold)}
.row .del{color:#e69a8c}
#cele{text-align:center}
#cele .big{font-size:3rem}
#cele p{line-height:1.55;margin:.6rem 0}
#cele .v{font:italic 600 1.2rem "Cormorant Garamond",serif;color:var(--gold2)}
.tools{display:flex;gap:1rem;justify-content:center;margin-top:1.4rem}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#verse{transition:none}}
</style>
<style>
[hidden]{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
#auth{max-width:420px;margin:0 auto;padding:12vh 1.2rem 2rem}
#auth .row{flex-direction:column}
.btn.off{opacity:.38;pointer-events:none}
.chip.due{background:var(--gold);color:var(--night);border-color:var(--gold)}
.chips{display:flex;gap:.4rem;margin-top:.4rem}
.chips button{flex:1;padding:.55rem;border-radius:10px;border:1px solid var(--line);background:none;color:var(--parch);font:600 .8rem Manrope;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:#10203a;border:1px solid var(--gold);padding:.7rem 1rem;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:9}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="sky"></div><div class="rays"></div><div id="verse"></div>

<section id="auth" hidden>
  <h1>GLM Evangelism</h1><p class="sub">Sign in to your private account</p>
  <label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button class="go" id="in">Sign in</button><button id="up">Create account</button><button class="link" id="fg">Forgot password?</button></div>
</section>

<main id="app" hidden>
  <div class="bar"><div><h1>GLM Evangelism</h1><p class="sub">Reach. Connect. Follow up.</p></div><button class="link" id="out">Sign out</button></div>
  <section class="panel" id="goal"></section>
  <nav class="tabs" id="tabs"><button data-t="today" class="on">Today</button><button data-t="all">Everyone</button><button data-t="won">Souls won</button></nav>
  <div id="list"></div>
</main>
<button class="fab" id="add" hidden>+ Add person</button>
<div id="toast" hidden></div>

<dialog id="dlg"><form method="dialog" id="f">
  <h2 id="dt">Add person</h2>
  <label>Name</label><input id="name" required>
  <label>Phone number</label><input id="phone" type="tel" inputmode="tel" placeholder="08012345678">
  <label>Where and when we met</label><input id="met">
  <label>Response</label>
  <select id="resp"><option>Interested</option><option>Not interested</option><option>Needs a visit</option><option>Started attending church</option><option>Got born again</option></select>
  <label>Language</label>
  <select id="lang"><option value="en">English</option><option value="pg">Pidgin</option><option value="yo">Yoruba</option></select>
  <label>Reach out on</label><input id="next" type="date">
  <div class="chips"><button type="button" data-d="1">Tomorrow</button><button type="button" data-d="3">In 3 days</button><button type="button" data-d="7">Next week</button></div>
  <label>Notes to remember (prayer request, needs, what they said)</label><textarea id="notes"></textarea>
  <div class="row"><button type="button" id="cancel">Cancel</button><button type="button" class="del" id="del" hidden>Delete</button><button class="go">Save</button></div>
</form></dialog>

<dialog id="cele"><div class="big">🎉</div><h2>Soul won!</h2><p id="enc"></p><p class="v" id="cv"></p><div class="row"><button class="go" id="ok">Keep going</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
const sb=supabase.createClient("https://ufyspxfgclbuneipclyu.supabase.co","sb_publishable_-41CpO98psGS42CU2OTBow_MIFf94NU");
let U=null,P=[],T=36,tab="today",editId=null,vi=0;
const V=[["The fruit of the righteous is a tree of life; and he that winneth souls is wise.","Proverbs 11:30"],["They that turn many to righteousness shall shine as the stars for ever and ever.","Daniel 12:3"],["The Son of man is come to seek and to save that which was lost.","Luke 19:10"],["Go ye into all the world, and preach the gospel to every creature.","Mark 16:15"],["Follow me, and I will make you fishers of men.","Matthew 4:19"],["There is joy in the presence of the angels of God over one sinner that repenteth.","Luke 15:10"],["He which converteth the sinner from the error of his way shall save a soul from death.","James 5:20"]];
const E=["Heaven is rejoicing over this one. Well done, soldier of the cross!","Your labour is not in vain. Another soul is safe because you showed up.","You sowed, you followed up, and now you are reaping. Keep pushing!","This is the fruit of your faithfulness. God sees every call and every message.","One soul is worth more than the whole world. Thank you for going."];
const today=()=>new Date().toLocaleDateString("en-CA"),month=()=>today().slice(0,7);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=p=>{let d=(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="234"+d.slice(1);return d};
const MSG={en:n=>`Hello ${n}, it was a joy meeting you. God bless you! I am checking on you to see how you are doing and how I can pray with you.`,pg:n=>`Hello ${n}, I really enjoy meet you. God bless you well well! I dey check on you to see how you dey, make we pray together.`,yo:n=>`Ẹ n lẹ́ ${n}, inú mi dùn láti pàdé yín. Ọlọ́run bùkún yín! Mo fẹ́ mọ bí ẹ ṣe wà, kí n sì bá yín gbàdúrà.`};
function showVerse(){const el=$("#verse");el.classList.add("off");setTimeout(()=>{const v=V[vi++%V.length];el.innerHTML=`${v[0]}<small>${v[1]}</small>`;el.classList.remove("off")},1600)}
showVerse();setInterval(showVerse,10000);
const add=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("en-CA")};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)};

async function load(){
  const [c,s]=await Promise.all([sb.from("contacts").select("*").order("next_date",{ascending:true,nullsFirst:false}),sb.from("settings").select("monthly_target").maybeSingle()]);
  if(c.error)return toast(c.error.message);
  P=c.data;T=(s.data&&s.data.monthly_target)||36;render();
}
const card=p=>{
  const ph=num(p.phone),due=!p.won_at&&p.next_date&&p.next_date<=today();
  return `<article class="card ${p.won_at?"won":""}"><div class="top"><div><h3>${esc(p.name)}</h3><p class="meta">${esc(p.met)||"No meeting details"}</p></div><span class="chip ${due?"due":""}">${p.won_at?"Soul won":due?"Reach out today":esc(p.response)}</span></div>${p.notes?`<p class="note">${esc(p.notes)}</p>`:""}<p class="when">${p.won_at?"Won "+p.won_at:p.next_date?"Reach out: "+p.next_date:"No reach-out date set"}${p.last_contacted?" · Last reached "+p.last_contacted:""}</p><div class="acts">${ph?`<a class="btn call" data-k="call" data-id="${p.id}" href="tel:+${ph}">Call</a><a class="btn wa" data-k="whatsapp" data-id="${p.id}" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent((MSG[p.lang]||MSG.en)(p.name))}">WhatsApp</a>`:`<span class="btn off">Call</span><span class="btn off">WhatsApp</span>`}${p.won_at?"":`<button class="win" data-a="won" data-id="${p.id}">Soul won</button><button data-a="snooze" data-id="${p.id}">+3 days</button>`}<button data-a="edit" data-id="${p.id}">Edit</button></div></article>`;
};
function render(){
  const won=P.filter(p=>p.won_at&&p.won_at.slice(0,7)===month()).length,pct=Math.min(1,won/Math.max(1,T)),C=2*Math.PI*44;
  $("#goal").innerHTML=`<div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(243,234,215,.12)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="#e0b45a" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><b>${won}</b></div><div><p><strong>${won} of ${T}</strong> souls this month.${won>=T?" Target reached. Glory to God!":` ${T-won} to go.`}</p><button class="link" id="tg">Change target</button></div>`;
  let L=P.filter(p=>!p.won_at);
  if(tab==="today")L=L.filter(p=>p.next_date&&p.next_date<=today());
  if(tab==="won")L=P.filter(p=>p.won_at).sort((a,b)=>b.won_at.localeCompare(a.won_at));
  $("#list").innerHTML=L.length?L.map(card).join(""):`<p class="empty">${tab==="today"?"Nobody to reach out to today.<br>Add a person or pick a date.":tab==="won"?"Your first soul won will appear here.":"No one yet. Tap Add person."}</p>`;
}
async function upd(id,v){const r=await sb.from("contacts").update(v).eq("id",id);if(r.error)return toast(r.error.message);await load()}

function openForm(id){
  editId=id;const p=P.find(x=>x.id===id)||{response:"Interested",lang:"en",next_date:add(1)};
  $("#dt").textContent=id?"Edit person":"Add person";$("#del").hidden=!id;
  const m={name:"name",phone:"phone",met:"met",resp:"response",lang:"lang",next:"next_date",notes:"notes"};
  for(const k in m)$("#"+k).value=p[m[k]]||"";
  $("#dlg").showModal();
}
$("#add").onclick=()=>openForm(null);
$("#cancel").onclick=()=>$("#dlg").close();
document.querySelector(".chips").onclick=e=>{const b=e.target.closest("button");if(b)$("#next").value=add(+b.dataset.d)};
$("#f").onsubmit=async()=>{
  const r={name:$("#name").value.trim(),phone:$("#phone").value.trim(),met:$("#met").value.trim(),response:$("#resp").value,lang:$("#lang").value,next_date:$("#next").value||null,notes:$("#notes").value.trim()};
  if(!r.name)return;
  const x=await(editId?sb.from("contacts").update(r).eq("id",editId):sb.from("contacts").insert(r));
  if(x.error)return toast(x.error.message);
  await load();
};
$("#del").onclick=async()=>{if(!confirm("Delete this person?"))return;await sb.from("contacts").delete().eq("id",editId);$("#dlg").close();load()};

$("#list").onclick=async e=>{
  const a=e.target.closest("a[data-k]");
  if(a){await sb.from("contact_log").insert({contact_id:a.dataset.id,kind:a.dataset.k});upd(a.dataset.id,{last_contacted:today()});return}
  const b=e.target.closest("button[data-a]");if(!b)return;
  if(b.dataset.a==="edit")return openForm(b.dataset.id);
  if(b.dataset.a==="snooze")return upd(b.dataset.id,{next_date:add(3)});
  await upd(b.dataset.id,{won_at:today(),response:"Got born again"});
  $("#enc").textContent=E[Math.floor(Math.random()*E.length)];
  const v=V[Math.floor(Math.random()*V.length)];$("#cv").textContent=`“${v[0]}” ${v[1]}`;$("#cele").showModal();
};
$("#ok").onclick=()=>$("#cele").close();
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("#goal").onclick=async e=>{
  if(e.target.id!=="tg")return;
  const n=parseInt(prompt("How many souls do you want to win this month?",T),10);
  if(!(n>0))return;
  const r=await sb.from("settings").upsert({user_id:U.id,monthly_target:n});
  if(r.error)return toast(r.error.message);
  T=n;render();
};

function showAuth(){U=null;$("#auth").hidden=false;$("#app").hidden=true;$("#add").hidden=true}
async function enter(u){U=u;$("#auth").hidden=true;$("#app").hidden=false;$("#add").hidden=false;await load()}
const creds=()=>({email:$("#em").value.trim(),password:$("#pw").value});
$("#in").onclick=async()=>{const r=await sb.auth.signInWithPassword(creds());r.error?toast(r.error.message):enter(r.data.user)};
$("#up").onclick=async()=>{
  const r=await sb.auth.signUp(creds());
  if(r.error)return toast(r.error.message);
  r.data.session?enter(r.data.user):toast("Check your email to confirm your account, then sign in.");
};
$("#fg").onclick=async()=>{
  const email=$("#em").value.trim();if(!email)return toast("Type your email first.");
  const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  toast(r.error?r.error.message:"Reset link sent. Check your email.");
};
$("#out").onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="SIGNED_OUT")showAuth();
  if(ev==="PASSWORD_RECOVERY"){const p=prompt("Choose a new password (6 or more characters)");if(p)sb.auth.updateUser({password:p}).then(r=>toast(r.error?r.error.message:"Password updated."))}
});
sb.auth.getSession().then(({data})=>data.session?enter(data.session.user):showAuth());
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
